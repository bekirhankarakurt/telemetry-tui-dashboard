[package]
name = "telemetry-tui-dashboard"
version = "1.0.0"
edition = "2021"
rust-version = "1.74"
description = "htop-style terminal dashboard for live UDP system telemetry"
license = "MIT"
repository = "https://github.com/bekirhankarakurt/telemetry-tui-dashboard"
readme = "README.md"
keywords = ["telemetry", "tui", "dashboard", "udp", "monitoring"]
categories = ["command-line-utilities", "visualization"]

[lib]
name = "telemetry_tui_dashboard"
path = "src/lib.rs"

[[bin]]
name = "telemetry-tui-dashboard"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
crossterm = "0.27"
ratatui = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
